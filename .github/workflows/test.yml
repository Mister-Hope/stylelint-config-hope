name: Build and Linter Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-linter:
    name: Build and Linter test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^26.0.0
          require-lockfile: true

      - name: Build project
        run: pnpm run build

      - name: Linter test
        run: |
          pnpm run lint:check
